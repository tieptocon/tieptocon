<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - TIEPTOCON</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #17181c;
            font-family: 'VT323', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .neon {
            font-size: 4.2rem;
            color: #fff;
            letter-spacing: 4px;
            position: relative;
            text-shadow:
                0 0 7px #f9d923, 0 0 14px #f9d923, 0 0 21px #e83d8f,
                0 0 42px #e83d8f, 0 0 82px #e83d8f;
            animation: flicker 1.8s infinite alternate;
            margin-bottom: 48px;
            z-index: 2;
        }
        @keyframes flicker {
            0%, 100% { opacity: 1;}
            12% { opacity: 0.6;}
            18% { opacity: 0.85;}
            22% { opacity: 0.2;}
            25% { opacity: 0.7;}
            28% { opacity: 0.9;}
            70% { opacity: 0.95;}
        }
        .contacts {
            display: flex;
            flex-direction: row;
            gap: 35px;
            margin-top: 16px;
            z-index: 2;
        }
        .contact-link {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            font-size: 2.1rem;
            padding: 14px 26px;
            border-radius: 17px;
            background: rgba(255,255,255,0.06);
            border: 2.2px solid #e83d8f66;
            color: #f9d923;
            box-shadow: 0 0 18px #e83d8f22;
            transition: background 0.2s, color 0.2s, border 0.2s, transform 0.2s;
            font-family: 'VT323', monospace;
            position: relative;
            overflow: hidden;
        }
        .contact-link i {
            transition: color 0.2s;
        }
        .contact-link:hover {
            background: #e83d8f;
            color: #fff;
            border-color: #fff;
            transform: scale(1.09) rotate(-2deg);
        }
        .contact-link:hover i {
            color: #f9d923;
        }
        .contact-link span {
            font-size: 1.25rem;
            letter-spacing: 2px;
        }
        /* Flying icon effect */
        .flying-icon {
            position: fixed;
            font-size: 2.4rem;
            opacity: 0.72;
            pointer-events: none;
            z-index: 1;
            filter: drop-shadow(0 0 8px #e83d8f66);
            will-change: transform, opacity;
            animation: flyicon 8s linear forwards;
        }
        @keyframes flyicon {
            0% {
                transform: translateY(110vh) scale(1) rotate(0deg);
                opacity: 0.82;
            }
            70% {
                opacity: 0.72;
            }
            80% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.1;
            }
            100% {
                transform: translateY(-10vh) scale(1.18) rotate(360deg);
                opacity: 0;
            }
        }
        /* Responsive */
        @media (max-width: 600px) {
            .neon { font-size: 2.1rem;}
            .contacts { flex-direction: column; gap: 18px;}
            .contact-link { font-size: 1.2rem; padding: 9px 12px;}
        }
    </style>
</head>
<body>
    <div class="neon">HELLO WORLD</div>
    <div class="contacts">
        <a class="contact-link" href="mailto:info@tieptocon.com" target="_blank">
            <i class="fas fa-envelope"></i> <span>Email</span>
        </a>
        <a class="contact-link" href="https://github.com/tieptocon" target="_blank">
            <i class="fab fa-github"></i> <span>GitHub</span>
        </a>
        <a class="contact-link" href="https://facebook.com/tiep.to.con" target="_blank">
            <i class="fab fa-facebook"></i> <span>Facebook</span>
        </a>
        <a class="contact-link" href="https://t.me/tieptocon" target="_blank">
            <i class="fab fa-telegram"></i> <span>Telegram</span>
        </a>
    </div>
    <!-- Flying Font Awesome icons (animated via JS) -->
    <script>
        // Array of Font Awesome icon classes to randomly pick
        const ICONS = [
            'fa-github', 'fa-facebook', 'fa-telegram', 'fa-envelope',
            'fa-code', 'fa-laptop-code', 'fa-terminal', 'fa-bolt', 
            'fa-star', 'fa-globe', 'fa-cloud', 'fa-rocket', 'fa-user-astronaut',
            'fa-lightbulb', 'fa-cube', 'fa-wand-magic-sparkles'
        ];
        function random(min,max){ return Math.random()*(max-min)+min; }
        function spawnIcon() {
            const icon = document.createElement('i');
            icon.className = 'flying-icon fa-solid';
            // Randomly decide between solid/brand icons
            if (Math.random() > 0.5) {
                icon.classList.add('fa-brands');
            }
            // Pick icon
            const iconClass = ICONS[Math.floor(Math.random()*ICONS.length)];
            icon.classList.add(iconClass);
            // Random horizontal position
            icon.style.left = random(5, 90) + 'vw';
            // Random size and color
            const size = random(1.5, 3.3);
            icon.style.fontSize = size + 'rem';
            const colors = ['#f9d923', '#e83d8f', '#82aaff', '#fff', '#43e97b'];
            icon.style.color = colors[Math.floor(Math.random()*colors.length)];
            icon.style.animationDuration = random(6.5,11) + 's';
            document.body.appendChild(icon);
            setTimeout(()=>icon.remove(), 12000);
        }
        setInterval(spawnIcon, 420);
        for(let i=0;i<7;i++) spawnIcon();
    </script>
</body>
</html>
