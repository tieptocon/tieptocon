<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - TIEPTOCON</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'VT323', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #0a0a1a;
            position: relative;
        }
        .container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 50%, #3b1a6b 0%, #0a1a3a 50%, #000 100%);
            animation: pulseBackground 4s infinite ease-in-out;
            transition: background 0.3s ease;
            position: relative;
            z-index: 1;
        }
        @keyframes pulseBackground {
            0%, 100% { background: radial-gradient(circle at 50% 50%, #3b1a6b 0%, #0a1a3a 50%, #000 100%); }
            33% { background: radial-gradient(circle at 50% 50%, #2f2a8b 0%, #0a1a3a 50%, #000 100%); }
            66% { background: radial-gradient(circle at 50% 50%, #1a4b7a 0%, #0a1a3a 50%, #000 100%); }
        }
        .ripple {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.5), transparent);
            border-radius: 50%;
            animation: rippleEffect 6s infinite ease-in-out;
            z-index: 0;
            pointer-events: none;
            filter: blur(5px);
        }
        @keyframes rippleEffect {
            0% {
                transform: scale(0) translate(0, 0);
                opacity: 0.6;
            }
            50% {
                transform: scale(4) translate(100px, -100px);
                opacity: 0.3;
            }
            100% {
                transform: scale(8) translate(200px, -200px);
                opacity: 0;
            }
        }
        .neon {
            font-size: 5.5rem;
            color: #e0f7fa;
            letter-spacing: 6px;
            position: relative;
            text-shadow:
                0 0 15px #8b5cf6,
                0 0 30px #8b5cf6,
                0 0 50px #c026d3,
                0 0 80px #7dd3fc,
                0 0 120px #6d28d9;
            animation: flicker 1.5s infinite alternate, rotate3D 8s infinite linear, vibrateNeon 0.1s infinite;
            margin-bottom: 60px;
            z-index: 2;
            transform: perspective(600px) rotateX(15deg) rotateY(15deg);
        }
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            10% { opacity: 0.5; }
            15% { opacity: 0.9; }
            20% { opacity: 0.3; }
            25% { opacity: 0.8; }
            30% { opacity: 0.95; }
        }
        @keyframes rotate3D {
            0% { transform: perspective(600px) rotateX(15deg) rotateY(15deg); }
            50% { transform: perspective(600px) rotateX(-15deg) rotateY(-15deg); }
            100% { transform: perspective(600px) rotateX(15deg) rotateY(15deg); }
        }
        @keyframes vibrateNeon {
            0%, 100% { transform: perspective(600px) rotateX(15deg) rotateY(15deg) translate(0, 0); }
            50% { transform: perspective(600px) rotateX(15deg) rotateY(15deg) translate(2px, -2px); }
        }
        .contacts {
            display: flex;
            flex-direction: row;
            gap: 50px;
            margin-top: 30px;
            z-index: 2;
        }
        .contact-link {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            font-size: 2.5rem;
            padding: 20px 40px;
            border-radius: 60px;
            background: rgba(139, 92, 246, 0.2);
            border: 3px solid transparent;
            border-image: linear-gradient(45deg, #8b5cf6, #c026d3, #7dd3fc) 1;
            color: #e0f7fa;
            box-shadow: 0 0 30px #8b5cf644;
            transition: all 0.3s ease;
            font-family: 'VT323', monospace;
            position: relative;
            overflow: hidden;
            animation: borderGlow 2.5s infinite linear;
        }
        @keyframes borderGlow {
            0% { border-image: linear-gradient(45deg, #8b5cf6, #c026d3, #7dd3fc) 1; }
            50% { border-image: linear-gradient(45deg, #c026d3, #7dd3fc, #8b5cf6) 1; }
            100% { border-image: linear-gradient(45deg, #8b5cf6, #c026d3, #7dd3fc) 1; }
        }
        .contact-link::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(192, 38, 211, 0.6), transparent);
            transition: 0.4s;
        }
        .contact-link:hover::after {
            left: 100%;
        }
        .contact-link:hover {
            background: linear-gradient(45deg, #6d28d9, #c026d3, #7dd3fc);
            color: #fff;
            transform: scale(1.15) rotate(-3deg) translateY(-8px);
            box-shadow: 0 0 50px #c026d3bb;
            animation: vibrate 0.08s infinite;
        }
        @keyframes vibrate {
            0%, 100% { transform: scale(1.15) rotate(-3deg) translateY(-8px); }
            50% { transform: scale(1.15) rotate(-3deg) translateY(-8px) translateX(3px); }
        }
        .contact-link i {
            transition: color 0.3s ease;
        }
        .contact-link:hover i {
            color: #fef08a;
        }
        .contact-link span {
            font-size: 1.5rem;
            letter-spacing: 3px;
        }
        .flying-icon {
            position: fixed;
            font-size: 3rem;
            opacity: 0.9;
            pointer-events: none;
            z-index: 1;
            animation: flyicon 5s linear forwards, glowIcon 1.5s infinite ease-in-out;
            will-change: transform, opacity;
        }
        @keyframes glowIcon {
            0%, 100% { filter: drop-shadow(0 0 12px #8b5cf699); color: #8b5cf6; }
            33% { filter: drop-shadow(0 0 18px #c026d399); color: #c026d3; }
            66% { filter: drop-shadow(0 0 15px #7dd3fc99); color: #7dd3fc; }
        }
        @keyframes flyicon {
            0% {
                transform: translateY(110vh) translateX(0) scale(1) rotate(0deg);
                opacity: 0.9;
            }
            50% {
                transform: translateY(50vh) translateX(15vw) scale(1.2) rotate(360deg);
                opacity: 0.7;
            }
            100% {
                transform: translateY(-10vh) translateX(-15vw) scale(1.4) rotate(720deg);
                opacity: 0;
            }
        }
        .sparkle {
            position: fixed;
            width: 8px;
            height: 8px;
            background: #8b5cf6;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: sparkleMove 4s linear forwards;
            filter: blur(3px);
            opacity: 0.8;
        }
        @keyframes sparkleMove {
            0% {
                transform: translate(var(--start-x), 100vh) scale(1);
                opacity: 0.8;
            }
            50% {
                transform: translate(var(--mid-x), 50vh) scale(1.5);
                opacity: 1;
            }
            100% {
                transform: translate(var(--end-x), -10vh) scale(0.7);
                opacity: 0;
            }
        }
        @media (max-width: 600px) {
            .neon { font-size: 3rem; }
            .contacts { flex-direction: column; gap: 25px; }
            .contact-link { font-size: 1.8rem; padding: 12px 20px; }
            .contact-link span { font-size: 1.2rem; }
            .sparkle { width: 6px; height: 6px; }
            .ripple { width: 150px; height: 150px; }
            .flying-icon { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="neon">HELLO WORLD</div>
        <div class="contacts">
            <a class="contact-link" href="mailto:info@tieptocon.com" target="_blank">
                <i class="fas fa-envelope"></i> <span>Email</span>
            </a>
            <a class="contact-link" href="https://github.com/tieptocon" target="_blank">
                <i class="fab fa-github"></i> <span>GitHub</span>
            </a>
            <a class="contact-link" href="https://facebook.com/tiep.to.con" target="_blank">
                <i class="fab fa-facebook"></i> <span>Facebook</span>
            </a>
            <a class="contact-link" href="https://t.me/tieptocon" target="_blank">
                <i class="fab fa-telegram"></i> <span>Telegram</span>
            </a>
        </div>
    </div>
    <script>
        const ICONS = [
            'fa-github', 'fa-facebook', 'fa-telegram', 'fa-envelope',
            'fa-code', 'fa-laptop-code', 'fa-terminal', 'fa-bolt', 
            'fa-star', 'fa-globe', 'fa-cloud', 'fa-rocket', 'fa-user-astronaut',
            'fa-lightbulb', 'fa-cube', 'fa-wand-magic-sparkles'
        ];
        function random(min, max) { return Math.random() * (max - min) + min; }
        function spawnIcon() {
            const icon = document.createElement('i');
            icon.className = 'flying-icon fa-solid';
            if (Math.random() > 0.5) {
                icon.classList.add('fa-brands');
            }
            const iconClass = ICONS[Math.floor(Math.random() * ICONS.length)];
            icon.classList.add(iconClass);
            icon.style.left = random(5, 90) + 'vw';
            const size = random(2, 4);
            icon.style.fontSize = size + 'rem';
            icon.style.animationDuration = random(4, 7) + 's';
            document.body.appendChild(icon);
            setTimeout(() => icon.remove(), 7000);
        }
        function spawnSparkle() {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            const colors = ['#8b5cf6', '#7dd3fc', '#22d3ee', '#c026d3', '#fef08a'];
            sparkle.style.background = colors[Math.floor(Math.random() * colors.length)];
            sparkle.style.left = random(0, 100) + 'vw';
            sparkle.style.setProperty('--start-x', random(-30, 30) + 'vw');
            sparkle.style.setProperty('--mid-x', random(-15, 15) + 'vw');
            sparkle.style.setProperty('--end-x', random(-30, 30) + 'vw');
            sparkle.style.animationDuration = random(3, 5) + 's';
            document.body.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 5000);
        }
        function spawnRipple() {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = random(0, 90) + 'vw';
            ripple.style.top = random(0, 90) + 'vh';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 6000);
        }
        setInterval(spawnIcon, 200); // Tăng tần suất xuất hiện
        setInterval(spawnSparkle, 100); // Tăng tần suất xuất hiện
        setInterval(spawnRipple, 1500); // Tăng tần suất xuất hiện
        for (let i = 0; i < 12; i++) spawnIcon(); // Tăng số lượng ban đầu
        for (let i = 0; i < 15; i++) spawnSparkle(); // Tăng số lượng ban đầu
        for (let i = 0; i < 5; i++) spawnRipple(); // Tăng số lượng ban đầu
    </script>
</body>
</html>
