<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - TIEPTOCON</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #131313;
            font-family: 'VT323', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .neon {
            font-size: 4.2rem;
            color: #fff;
            letter-spacing: 4px;
            position: relative;
            text-shadow:
                0 0 7px #f9d923, 0 0 14px #f9d923, 0 0 21px #e83d8f,
                0 0 42px #e83d8f, 0 0 82px #e83d8f;
            animation: flicker 1.8s infinite alternate;
            margin-bottom: 48px;
            z-index: 2;
        }
        @keyframes flicker {
            0%, 100% { opacity: 1;}
            12% { opacity: 0.6;}
            18% { opacity: 0.85;}
            22% { opacity: 0.2;}
            25% { opacity: 0.7;}
            28% { opacity: 0.9;}
            70% { opacity: 0.95;}
        }
        .glow-orb {
            position: absolute;
            width: 340px;
            height: 340px;
            background: radial-gradient(circle at 60% 40%, #e83d8f77 0%, #f9d92344 70%, #131313 100%);
            border-radius: 50%;
            left: 50%;
            top: 36%;
            transform: translate(-50%,-50%);
            filter: blur(7px);
            z-index: 0;
            animation: orbmove 8s infinite alternate ease-in-out;
        }
        @keyframes orbmove {
            0% { left: 49%; top:38%;}
            50% { left:52%; top:42%;}
            100% { left:47%; top:36%;}
        }
        .contacts {
            display: flex;
            flex-direction: row;
            gap: 35px;
            margin-top: 16px;
            z-index: 2;
        }
        .contact-link {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            font-size: 2.1rem;
            padding: 14px 26px;
            border-radius: 17px;
            background: rgba(255,255,255,0.06);
            border: 2.2px solid #e83d8f66;
            color: #f9d923;
            box-shadow: 0 0 18px #e83d8f22;
            transition: background 0.2s, color 0.2s, border 0.2s, transform 0.2s;
            font-family: 'VT323', monospace;
            position: relative;
            overflow: hidden;
        }
        .contact-link i {
            transition: color 0.2s;
        }
        .contact-link:hover {
            background: #e83d8f;
            color: #fff;
            border-color: #fff;
            transform: scale(1.09) rotate(-2deg);
        }
        .contact-link:hover i {
            color: #f9d923;
        }
        .contact-link span {
            font-size: 1.25rem;
            letter-spacing: 2px;
        }
        /* Floating emoji effect */
        .float-emoji {
            position: fixed;
            font-size: 2.2rem;
            opacity: 0.45;
            animation: floatemoji 8s linear infinite;
            pointer-events: none;
            z-index: 1;
            filter: blur(0.5px);
        }
        @keyframes floatemoji {
            0% { transform: translateY(110vh) scale(1) rotate(0deg);}
            95% {opacity:0.45;}
            100% { transform: translateY(-10vh) scale(1.3) rotate(360deg); opacity:0;}
        }
        /* Responsive */
        @media (max-width: 600px) {
            .neon { font-size: 2.1rem;}
            .contacts { flex-direction: column; gap: 18px;}
            .contact-link { font-size: 1.2rem; padding: 9px 12px;}
        }
    </style>
</head>
<body>
    <div class="glow-orb"></div>
    <div class="neon">HELLO WORLD</div>
    <div class="contacts">
        <a class="contact-link" href="mailto:info@tieptocon.com" target="_blank">
            <i class="fas fa-envelope"></i> <span>Email</span>
        </a>
        <a class="contact-link" href="https://github.com/tieptocon" target="_blank">
            <i class="fab fa-github"></i> <span>GitHub</span>
        </a>
        <a class="contact-link" href="https://facebook.com/tiep.to.con" target="_blank">
            <i class="fab fa-facebook"></i> <span>Facebook</span>
        </a>
        <a class="contact-link" href="https://t.me/tieptocon" target="_blank">
            <i class="fab fa-telegram"></i> <span>Telegram</span>
        </a>
    </div>
    <!-- Floating emoji (randomly scattered via JS) -->
    <script>
        const EMOJIS = ['✨','🦄','👾','💡','🚀','😎','🎉','🖤','💻','🌀','🔥','🌈'];
        function random(min,max){ return Math.random()*(max-min)+min; }
        function spawnEmoji() {
            const emoji = document.createElement('div');
            emoji.className = 'float-emoji';
            emoji.style.left = random(0,90) + 'vw';
            emoji.style.animationDuration = random(7,13) + 's';
            emoji.style.fontSize = random(1.5,3.5) + 'rem';
            emoji.innerText = EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
            document.body.appendChild(emoji);
            setTimeout(()=>emoji.remove(), 14000);
        }
        setInterval(spawnEmoji, 600);
        for(let i=0;i<5;i++) spawnEmoji();
    </script>
</body>
</html>
