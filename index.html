<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - TIEPTOCON</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'VT323', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #0a0a1a; /* Màu nền tối làm nền tảng */
        }
        .container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 50%, #2a1a4b 0%, #0a1a2a 50%, #000 100%); /* Tím đậm */
            animation: pulseBackground 1.8s infinite alternate ease-in-out; /* Đồng bộ với flicker */
            transition: background 0.3s ease; /* Chuyển màu mượt mà */
            position: relative;
            z-index: 1;
        }
        @keyframes pulseBackground {
            0% {
                background: radial-gradient(circle at 50% 50%, #2a1a4b 0%, #0a1a2a 50%, #000 100%); /* Tím đậm */
            }
            50% {
                background: radial-gradient(circle at 50% 50%, #1a2a44 0%, #0a1a2a 50%, #000 100%); /* Trung gian */
            }
            100% {
                background: radial-gradient(circle at 50% 50%, #1a3b5a 0%, #0a1a2a 50%, #000 100%); /* Xanh lam đậm */
            }
        }
        .neon {
            font-size: 4.5rem;
            color: #e0f7fa;
            letter-spacing: 5px;
            position: relative;
            text-shadow:
                0 0 10px #8b5cf6,
                0 0 20px #8b5cf6,
                0 0 30px #7dd3fc,
                0 0 50px #7dd3fc,
                0 0 80px #6d28d9; /* Ánh sáng tím và cyan */
            animation: flicker 1.8s infinite alternate; /* Hiệu ứng nháy gốc */
            margin-bottom: 50px;
            z-index: 2;
        }
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            12% { opacity: 0.6; }
            18% { opacity: 0.85; }
            22% { opacity: 0.2; }
            25% { opacity: 0.7; }
            28% { opacity: 0.9; }
            70% { opacity: 0.95; }
        }
        .contacts {
            display: flex;
            flex-direction: row;
            gap: 40px;
            margin-top: 20px;
            z-index: 2;
        }
        .contact-link {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            font-size: 2.2rem;
            padding: 15px 30px;
            border-radius: 50px;
            background: rgba(139, 92, 246, 0.15);
            border: 2px solid #8b5cf666;
            color: #8b5cf6;
            box-shadow: 0 0 20px #8b5cf622;
            transition: all 0.4s ease;
            font-family: 'VT323', monospace;
            position: relative;
            overflow: hidden;
        }
        .contact-link::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(125, 211, 252, 0.4), transparent);
            transition: 0.5s;
        }
        .contact-link:hover::after {
            left: 100%;
        }
        .contact-link:hover {
            background: linear-gradient(45deg, #6d28d9, #7dd3fc);
            color: #fff;
            border-color: #7dd3fc;
            transform: scale(1.1) rotate(-2deg);
            box-shadow: 0 0 25px #7dd3fc88;
        }
        .contact-link i {
            transition: color 0.4s ease;
        }
        .contact-link:hover i {
            color: #fef08a;
        }
        .contact-link span {
            font-size: 1.3rem;
            letter-spacing: 2px;
        }
        .flying-icon {
            position: fixed;
            font-size: 2.4rem;
            opacity: 0.8;
            pointer-events: none;
            z-index: 1;
            filter: drop-shadow(0 0 8px #8b5cf666);
            animation: flyicon 7s linear forwards;
            will-change: transform, opacity;
        }
        @keyframes flyicon {
            0% {
                transform: translateY(110vh) translateX(0) scale(1) rotate(0deg);
                opacity: 0.8;
            }
            50% {
                transform: translateY(50vh) translateX(10vw) scale(1.1) rotate(180deg);
                opacity: 0.6;
            }
            100% {
                transform: translateY(-10vh) translateX(-10vw) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }
        @media (max-width: 600px) {
            .neon { font-size: 2.5rem; }
            .contacts { flex-direction: column; gap: 20px; }
            .contact-link { font-size: 1.3rem; padding: 10px 15px; }
            .contact-link span { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="neon">HELLO WORLD</div>
        <div class="contacts">
            <a class="contact-link" href="mailto:info@tieptocon.com" target="_blank">
                <i class="fas fa-envelope"></i> <span>Email</span>
            </a>
            <a class="contact-link" href="https://github.com/tieptocon" target="_blank">
                <i class="fab fa-github"></i> <span>GitHub</span>
            </a>
            <a class="contact-link" href="https://facebook.com/tiep.to.con" target="_blank">
                <i class="fab fa-facebook"></i> <span>Facebook</span>
            </a>
            <a class="contact-link" href="https://t.me/tieptocon" target="_blank">
                <i class="fab fa-telegram"></i> <span>Telegram</span>
            </a>
        </div>
    </div>
    <script>
        const ICONS = [
            'fa-github', 'fa-facebook', 'fa-telegram', 'fa-envelope',
            'fa-code', 'fa-laptop-code', 'fa-terminal', 'fa-bolt', 
            'fa-star', 'fa-globe', 'fa-cloud', 'fa-rocket', 'fa-user-astronaut',
            'fa-lightbulb', 'fa-cube', 'fa-wand-magic-sparkles'
        ];
        function random(min, max) { return Math.random() * (max - min) + min; }
        function spawnIcon() {
            const icon = document.createElement('i');
            icon.className = 'flying-icon fa-solid';
            if (Math.random() > 0.5) {
                icon.classList.add('fa-brands');
            }
            const iconClass = ICONS[Math.floor(Math.random() * ICONS.length)];
            icon.classList.add(iconClass);
            icon.style.left = random(10, 80) + 'vw';
            const size = random(1.8, 3.5);
            icon.style.fontSize = size + 'rem';
            const colors = ['#8b5cf6', '#7dd3fc', '#22d3ee', '#6d28d9', '#38bdf8']; /* Tím và xanh lam */
            icon.style.color = colors[Math.floor(Math.random() * colors.length)];
            icon.style.animationDuration = random(6, 9) + 's';
            document.body.appendChild(icon);
            setTimeout(() => icon.remove(), 9000);
        }
        setInterval(spawnIcon, 350);
        for (let i = 0; i < 8; i++) spawnIcon();
    </script>
</body>
</html>
