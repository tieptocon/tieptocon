<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - TIEPTOCON</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #21243a 0%, #e83d8f 100%);
            min-height: 100vh;
            margin: 0;
            font-family: 'VT323', monospace;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .glitch {
            font-size: 4rem;
            font-weight: bold;
            position: relative;
            color: #f9d923;
            letter-spacing: 3px;
            animation: flicker 2.5s infinite alternate;
        }
        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            left: 0;
            width: 100%;
            overflow: hidden;
            color: #fff;
            z-index: -1;
        }
        .glitch::before {
            top: -2px;
            left: 2px;
            color: #e83d8f;
            opacity: 0.7;
            animation: glitchTop 1.2s infinite linear alternate-reverse;
        }
        .glitch::after {
            top: 2px;
            left: -2px;
            color: #82aaff;
            opacity: 0.7;
            animation: glitchBot 1.1s infinite linear alternate-reverse;
        }
        @keyframes glitchTop {
            0% { left: 2px; }
            20% { left: 8px; }
            40% { left: 3px; }
            60% { left: 1px; }
            80% { left: 6px; }
            100% { left: 2px; }
        }
        @keyframes glitchBot {
            0% { left: -2px; }
            20% { left: -6px; }
            40% { left: -4px; }
            60% { left: -7px; }
            80% { left: -1px; }
            100% { left: -2px; }
        }
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            10% { opacity: 0.85; }
            20% { opacity: 0.7; }
            30%, 50% { opacity: 1; }
            60% { opacity: 0.8; }
            80% { opacity: 0.95; }
        }
        .contacts {
            margin-top: 38px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }
        .contact-link {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(2px);
            color: #f9d923;
            padding: 12px 32px;
            border-radius: 14px;
            font-size: 1.3rem;
            font-family: 'VT323', monospace;
            letter-spacing: 2px;
            text-decoration: none;
            border: 1.5px solid #f9d92366;
            transition: background 0.2s, color 0.2s, border 0.2s;
            box-shadow: 0 1px 8px #e83d8f44;
            display: inline-block;
        }
        .contact-link:hover {
            background: #e83d8f;
            color: #fff;
            border-color: #fff;
        }
        @media (max-width: 500px) {
            .glitch { font-size: 2.2rem; }
            .contact-link { font-size: 1rem; padding: 10px 18px; }
        }
    </style>
</head>
<body>
    <div class="glitch" data-text="HELLO WORLD">HELLO WORLD</div>
    <div class="contacts">
        <a class="contact-link" href="mailto:info@tieptocon.com" target="_blank">📧 info@tieptocon.com</a>
        <a class="contact-link" href="https://github.com/tieptocon" target="_blank">🐙 GitHub</a>
        <a class="contact-link" href="https://facebook.com/tiep.to.con" target="_blank">🌐 Facebook</a>
    </div>
</body>
</html>
